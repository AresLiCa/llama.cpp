name: Publish Docker image

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  build_cuda13_server:
    name: Build and push CUDA13 server image
    runs-on: self-hosted

    steps:
      - name: Check out the repo
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase owner
        id: owner
        run: echo "value=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Get build date
        id: build_date
        run: echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      # 1. 注释掉清理磁盘（Self-hosted runner 不需要，跑起来也浪费时间）
      # - name: Free Disk Space (Ubuntu)
      #   uses: ggml-org/free-disk-space@v1.3.1
      #   with:
      #     tool-cache: false
      #     android: true
      #     dotnet: true
      #     haskell: true
      #     large-packages: true
      #     docker-images: true
      #     swap-storage: true

      - name: Build and push CUDA13 server image
        id: build_server
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          platforms: linux/amd64
          # 2. 替换为极简 inline 镜像构建
          inline: |
            FROM alpine:latest
            RUN echo "Dummy image for pipeline test" > /test.txt
          outputs: type=image,name=ghcr.io/${{ steps.owner.outputs.value }}/llama.cpp,push=true,name-canonical=true,oci-mediatypes=true
          # 3. 注释掉实际耗时编译的资源定义
          # file: .devops/cuda.Dockerfile
          # target: server
          provenance: false
          build-args: |
            BUILD_DATE=${{ steps.build_date.outputs.date }}
            APP_VERSION=${{ github.sha }}
            APP_REVISION=${{ github.sha }}
            CUDA_VERSION=13.3.0
          annotations: |
            manifest:org.opencontainers.image.created=${{ steps.build_date.outputs.date }}
            manifest:org.opencontainers.image.version=${{ github.sha }}
            manifest:org.opencontainers.image.revision=${{ github.sha }}
            manifest:org.opencontainers.image.title=llama.cpp
            manifest:org.opencontainers.image.description=LLM inference in C/C++ with NCCL multi-GPU support
            manifest:org.opencontainers.image.url=https://github.com/${{ github.repository }}
            manifest:org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # 4. 暂时注释掉 Remote Registry Cache，测试阶段不需要读写远端缓存
          # cache-from: type=registry,ref=ghcr.io/${{ steps.owner.outputs.value }}/llama.cpp:buildcache-cuda13
          # cache-to: type=registry,ref=ghcr.io/${{ steps.owner.outputs.value }}/llama.cpp:buildcache-cuda13,mode=max

      - name: Tag image as server-cuda13
        run: |
          set -euo pipefail
          IMAGE_REPO="ghcr.io/${{ steps.owner.outputs.value }}/llama.cpp"
          DIGEST="${{ steps.build_server.outputs.digest }}"
          docker buildx imagetools create \
            --tag "${IMAGE_REPO}:server-cuda13" \
            --tag "${IMAGE_REPO}:server-cuda13-${{ github.sha }}" \
            "${IMAGE_REPO}@${DIGEST}"
        env:
          REGISTRY_AUTH: 1
